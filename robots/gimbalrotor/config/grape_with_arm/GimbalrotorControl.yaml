aerial_robot_control_name: aerial_robot_control/gimbalrotor_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : false
  # [rad] 45 deg: with little thrust (a landing) the side force of the position control asked for gimbal
  # angles beyond 90 deg (71 deg on the real machine on 2026-09-18, up to 174 deg in gazebo with the real
  # actuator delays), where the limit kept the landing drift and the liftoff tilt smaller
  gimbal_angle_limit: 0.785

  # the learned controller (bringup.launch policy:=true, aerial_robot_control/gimbalrotor_policy_controller):
  # the policy's command replaces the PID's thrusts and gimbal angles only while policy/enable is true and
  # the last command of policy_node.py is at most timeout [s] old; the PID flies otherwise
  policy:
    enable: false
    timeout: 0.02
    thrust_max: 30.0
    landed_height: 0.05

  xy:
    # takeoff: no x / y control until 5 cm above the height at arming; on the ground the robot slid and
    # turned forward under it as it got light (2026-09-18)
    start_control_height: 0.05
    # landing: no x / y control below 15 cm; with little thrust it asked for gimbal tilts at the limit and
    # pushed the robot 0.1-0.4 m sideways (gazebo)
    stop_control_height: 0.15
    # 3/0.1/1 until 2026-09-18. The side force of the position control tilts the gimbals, and that force turns
    # the roll / pitch 0.45 s later through the height of the rotors above the centroid (half of the pitch
    # torque in the hovers of 2026-09-17). In gazebo calibrated on the real flights, at the slowest plants
    # (1.75-2 times the measured actuator delays) 3/0.1/1 turned over in 6 of 8 takeoffs and 2/0.05/1.5 (the
    # gazebo config) hovered in 8 of 8, within 3 deg rms
    p_gain: 2.0
    i_gain: 0.05
    d_gain: 1.5
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    # takeoff: this acceleration (a little under g) is ramped in over 1.5 s, so that the thrust does not
    # have to come from the I term at about 2 N/s, which kept the robot light on the ground for 12-20 s
    takeoff_feedforward_acc: 9.0
    takeoff_feedforward_ramp_time: 1.5
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    # the roll/pitch I control starts this far above the height at arming. The lidar odometry (fast_lio)
    # wanders about 1 cm standing still, so 0.01 started it on the ground 0.8 s into a takeoff, where
    # the integral grew for 10 s and tilted the robot by 10-16 deg as it left the ground (2026-09-17)
    start_rp_integration_height: 0.1

  pitch:
    # 10 until 2026-09-17: the hovers shook by about 6 deg rms, which gazebo with the actuator delays of the
    # real machine reproduces (8 deg), and 8 does not there (0.5 deg). 6, the best in gazebo, ran away forward
    # on the real machine (23:52, not recorded). With the takeoff feedforward, no xy control near the ground and
    # the xy gains 2/0.05/1.5, gazebo calibrated on the real flights (7 plants, 2 runs each) hovers with 8 within
    # 0.5-3.6 deg rms everywhere, where 10 shakes by 6-8 deg at the model inertia (as the real machine did)
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 8.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  roll:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 8.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  yaw:
    # sized on the flights of 2026-09-17: near liftoff a yaw torque of 0.6-1.0 Nm turned the robot by
    # 90-116 deg with 4/1/2, which a simulation of the plant identified from the flights reproduces. With
    # 10/5/4 that simulation stays within 20-23 deg for 1 Nm (gimbal servo lag 0.1 s, the real inertia up
    # to 2.3 times the model), and gazebo (0.8 Nm for 6 s) within 6 deg with the arm (5/1/2: 14 deg) and
    # 12 deg without the pipe (5/1/2: 33 deg). A d gain of 6 shakes the yaw at 4 Hz with the arm in
    # gazebo (5 does not)
    p_gain: 10.0
    i_gain: 5.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true
