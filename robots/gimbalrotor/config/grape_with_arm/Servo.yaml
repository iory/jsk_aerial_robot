servo_controller:
  gimbals:
    angle_sgn: 1
    angle_scale: 0.001534
    zero_point_offset: 2047

    # for simulation
    simulation:
      pid: {p: 50.0, i: 0.01, d: 1.0, i_clamp_min: -6.6, i_clamp_max: 6.6}
      init_value: 0.0
      type: effort_controllers/JointPositionController

    controller1:
      id: 0
      name: gimbal1

    controller2:
      id: 1
      name: gimbal2

    controller3:
      id: 2
      name: gimbal3

    controller4:
      id: 3
      name: gimbal4

  joints:
    angle_sgn: 1
    angle_scale: 0.001534
    zero_point_offset: 2047

    simulation:
      pid: {p: 10.0, i: 0.5, d: 0.2, i_clamp_max: 2.0, i_clamp_min: -2.0}
      init_value: 0.0
      type: effort_controllers/JointPositionController

    controller1:
      id: 4
      name: arm_joint1_joint1
      angle_sgn: -1

    controller2:
      id: 5
      name: arm_joint2_joint1

    controller3:
      id: 6
      name: arm_joint3_joint1

    controller4:
      id: 7
      name: arm_joint4_joint1
      # the group i leaves ~0.045 rad for tens of seconds: p holds the ~0.44 N m gravity torque
      # of the links beyond joint4 (p * e = 10 * 0.045). i = 10 removes it with a time constant
      # of p / i = 1 s, still stable for I = 5.3e-3 kg m^2 (d * p > I * i).
      simulation:
        pid: {p: 10.0, i: 10.0, d: 0.2, i_clamp_max: 2.0, i_clamp_min: -2.0}

    controller5:
      id: 8
      name: arm_joint5_joint1
      # joint5 drives the gripper screw: in gazebo it only rotates arm_joint5_link1
      # (I = 6.4e-8 kg m^2, the gripper follows via <mimic>), so the group gains diverge
      # at the 1 ms step (explicit damping needs d * dt / I < 2).
      # p = I * wn^2, d = 2 * zeta * I * wn with wn = 100 rad/s, zeta = 1.
      simulation:
        pid: {p: 0.00064, i: 0.0, d: 0.0000128, i_clamp_max: 2.0, i_clamp_min: -2.0}
