# Grape harvest demo of grape_with_arm
#
# script/skrobot_grape_harvest_demo.py reads this file to fly to the bunches and the crate,
# and script/make_grape_vineyard_world.py generates the gazebo world (worlds/grape_vineyard.world) from it.
#
# All positions are in the field frame [m]:
#   origin : on the ground right below the robot (main_body) where it stands before takeoff
#   x      : the heading of the robot before takeoff
#   z      : up
# In gazebo the robot spawns at the origin of the world with yaw 0, so the field frame is the world frame.
# For the real machine, measure the bunches and the crate from where the robot is placed.

field:
  # grape bunches to harvest, visited in this order
  bunches:
    - name: kyoho_black
      # the point on the stem that the gripper pinches
      stem: [2.0, 0.0, 1.10]
    - name: red_globe
      stem: [2.0, 0.55, 1.15]
    - name: green_thompson
      stem: [2.0, -0.55, 1.05]

  # crates on the ground; the bunches are dropped into drop_crate
  crates:
    - position: [0.9, -1.4, 0.0]   # center of the bottom
      yaw: 0.0
    - position: [0.1, -2.0, 0.0]
      yaw: 0.3
    - position: [0.1, -2.0, 0.3]   # stacked on the previous one
      yaw: 0.3
  drop_crate: 0
  crate_size: [0.5, 0.5, 0.3]      # outer size [x, y, height]

  # rows of vines (gazebo world only)
  # the canopy of a row is about 0.9 m thick and 2.2 m high, and the row extends 6.5 m along its axis
  vine_rows:
    - {center: [2.6, -3.2], yaw: 1.5708}
    - {center: [2.6, 3.2], yaw: 1.5708}
    - {center: [5.4, -3.2], yaw: 1.5708}
    - {center: [5.4, 3.2], yaw: 1.5708}
    - {center: [-2.8, -3.2], yaw: 1.5708}
    - {center: [-2.8, 3.2], yaw: 1.5708}

# with --targets detect the bunches come from grape_detector (jsk_recognition_msgs/BoundingBoxArray)
# instead of field/bunches above; see script/skrobot_grape_harvest_demo.py
detection:
  topic: /grape_boxes/boxes
  world_frame: world
  observe_time: 3.0        # [s] the boxes are collected for this long before the targets are picked
  min_observations: 3      # a bunch has to be seen in this many messages
  # [s] the collection goes on past observe_time (and refine_time) until min_observations messages
  # have come, for a slow detector; the boxes came at 1.3 Hz in gazebo while it was recorded
  observe_timeout: 10.0
  cluster_radius: 0.12     # [m] boxes nearer than this to each other are the same bunch
  # the gripper pinches the stem, which is just above the top of the box of the berries
  stem_offset: 0.015       # [m]
  max_box_size: 0.4        # [m] a bigger box is a clump of canopy, not a bunch
  max_targets: 3
  # where a bunch the robot may pick is, in the field frame [m]: the ones hanging at the front face
  # of the row. The bunches deeper in the canopy are detected as well (they are real grapes), but
  # the rotors would be in the leaves before the gripper reached them.
  region:
    x: [1.6, 2.2]
    y: [-1.5, 1.5]
    z: [0.8, 1.6]

motion:
  # the gripper approaches a stem horizontally along the heading of the robot
  approach_distance: 0.35   # distance in front of the stem where the approach starts
  retreat_distance: 0.5     # distance to back off after grasping
  lift_height: 0.05         # height to lift the bunch while backing off
  # the gripper is lowered to release_height above the crate bottom from release_height + crate_clearance
  release_height: 0.5
  crate_clearance: 0.3
  # The robot flies with the arm folded and stops where the arm, reaching out, holds the stem; the
  # arm covers the last stretch, so that an error of the flight (and of the odometry, when the
  # target is re-detected from the camera) is taken out by the arm instead of going into the grasp.
  # The arm folds at its three yaw joints (root, second and third) into a Z; their sum is 0, so the
  # gripper keeps pointing forward. In this pose the arm is 3.0 cm from the body and the legs and
  # below the rotors. From it, the inverse kinematics of scikit-robot reaches the stem.
  waiting_arm_pose: {arm_joint1_joint1: 1.05, arm_joint2_joint1: -2.1, arm_joint3_joint1: 1.05}
  # The open gripper first goes pre_reach_distance behind the stem, in line with it, and then straight
  # forward onto it in reach_steps poses over reach_time. Going straight from the folded arm, the
  # fingers would sweep across the stem from the side.
  pre_reach_distance: 0.06  # [m] 0.08 folds joint2 past max_arm_angle
  reach_steps: 8
  reach_time: 2.0           # [s]
  # where the body is placed: the gripper on the stem is this much short of the stretched arm, which
  # leaves the arm room to reach 0.12 m sideways, 0.08 m up and down and 0.04 m forward
  arm_reach_margin: 0.05    # [m]
  # a stem further than this from where the body was placed for is refused, and so is a pose that
  # folds a joint further than max_arm_angle (the demo has no collision model of the arm)
  max_arm_correction: 0.14  # [m]
  max_arm_angle: 2.35       # [rad] 135 deg
  # the servos do not land exactly on the angles they are given, so the gripper is measured from
  # the joint angles after the motion and the arm is sent again, up to max_arm_tries times
  max_arm_tries: 3
  # the bunch is measured again from the standoff, where the camera is close to it; the target is
  # then given to the arm in the frame of the robot, which no odometry error enters
  refine_time: 1.5          # [s] 0 to keep the target of the plan
  refine_radius: 0.25       # [m] a detection further from the expected stem is another bunch

  # arm joint angles [rad]; joints not listed are 0
  grasp_arm_pose: {}
  release_arm_pose: {arm_joint4_joint1: 0.5}
  arm_time: 2.0             # duration of an arm motion [s]
  gripper_time: 1.5         # duration of a gripper motion [s]
  gripper_width_tolerance: 0.003  # opening shorter than fully open by more than this is a failure [m]
  hold_time: 1.0            # wait after a grasp or a release [s]
  # convergence of flight motions (CoG position [m], velocity [m/s], yaw [rad])
  # coarse: motions in free space
  coarse_pos_thresh: 0.10
  coarse_vel_thresh: 0.05
  coarse_yaw_thresh: 0.05
  # fine: lining up with a stem, grasping and releasing over the crate
  # (a yaw error of 0.05 rad already moves the gripper 3.6 cm sideways at the end of the arm)
  fine_pos_thresh: 0.02
  fine_vel_thresh: 0.02
  fine_yaw_thresh: 0.03
  # after a fine motion, the gripper error measured with the odometry and the joint angles must stay
  # within gripper_tolerance for settle_time; a steady error moves the CoG target (max_corrections),
  # and the demo stops if the gripper does not settle within max_settle_windows
  gripper_tolerance: 0.015  # [m]
  settle_time: 1.0          # [s]
  max_settle_windows: 20
  max_corrections: 5
  flight_timeout: 40.0      # [s]
